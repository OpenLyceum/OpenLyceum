<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330" role="img" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">
<title>Grid for a histogram of planet radii</title>
<desc>Empty axes for a bar chart: number of transiting planets (0 to 800) in five radius bins from 1.0 to 3.0 Earth radii.</desc>
<defs></defs>
<rect width="560" height="330" fill="#ffffff"/>
<rect x="80" y="30" width="440" height="240" fill="none" stroke="#1f2328"/>
<line x1="80" y1="270" x2="520" y2="270" stroke="#8c959f" stroke-width="1"/>
<text x="72" y="274" text-anchor="end" font-size="12">0</text>
<line x1="80" y1="240" x2="520" y2="240" stroke="#e3e6ea" stroke-width="1"/>
<line x1="80" y1="210" x2="520" y2="210" stroke="#8c959f" stroke-width="1"/>
<text x="72" y="214" text-anchor="end" font-size="12">200</text>
<line x1="80" y1="180" x2="520" y2="180" stroke="#e3e6ea" stroke-width="1"/>
<line x1="80" y1="150" x2="520" y2="150" stroke="#8c959f" stroke-width="1"/>
<text x="72" y="154" text-anchor="end" font-size="12">400</text>
<line x1="80" y1="120" x2="520" y2="120" stroke="#e3e6ea" stroke-width="1"/>
<line x1="80" y1="90" x2="520" y2="90" stroke="#8c959f" stroke-width="1"/>
<text x="72" y="94" text-anchor="end" font-size="12">600</text>
<line x1="80" y1="60" x2="520" y2="60" stroke="#e3e6ea" stroke-width="1"/>
<line x1="80" y1="30" x2="520" y2="30" stroke="#8c959f" stroke-width="1"/>
<text x="72" y="34" text-anchor="end" font-size="12">800</text>
<line x1="80" y1="270" x2="80" y2="276" stroke="#1f2328"/>
<text x="124" y="292" text-anchor="middle" font-size="12">1.0–1.4</text>
<line x1="168" y1="270" x2="168" y2="276" stroke="#1f2328"/>
<text x="212" y="292" text-anchor="middle" font-size="12">1.4–1.8</text>
<line x1="256" y1="270" x2="256" y2="276" stroke="#1f2328"/>
<text x="300" y="292" text-anchor="middle" font-size="12">1.8–2.2</text>
<line x1="344" y1="270" x2="344" y2="276" stroke="#1f2328"/>
<text x="388" y="292" text-anchor="middle" font-size="12">2.2–2.6</text>
<line x1="432" y1="270" x2="432" y2="276" stroke="#1f2328"/>
<text x="476" y="292" text-anchor="middle" font-size="12">2.6–3.0</text>
<text x="300" y="320" text-anchor="middle" font-size="13">Planet radius (Earth = 1)</text>
<text x="24" y="150" text-anchor="middle" font-size="13" transform="rotate(-90 24 150)">Number of planets</text>

</svg>
