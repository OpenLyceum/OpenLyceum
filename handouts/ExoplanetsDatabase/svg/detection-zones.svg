<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" role="img" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">
<title>Where each detection method can find planets</title>
<desc>Schematic of planet mass against distance from a Sun-like star, both on log scales. Radial velocity finds massive planets out to about 10 au, transits find planets close to their stars, microlensing finds planets a few au out, and imaging finds very massive planets far out. The Solar System planets are marked; Earth lies outside or at the edge of every region.</desc>
