<svg xmlns="http://www.w3.org/2000/svg" width="660" height="320" viewBox="0 0 660 320" role="img" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">
<title>How a greenhouse atmosphere warms the ground</title>
<desc>Sunlight passes through the atmosphere to the ground. The ground gives off infrared, which gases in the atmosphere absorb. The atmosphere sends part of it to space and part back down, so the ground ends up warmer than a bare rock would.</desc>
<defs></defs>
<rect width="660" height="320" fill="#ffffff"/>
<rect x="0" y="250" width="660" height="70" fill="#b9a088"/>
<text x="20" y="276" fill="#fff" font-weight="bold" font-size="13">Ground (and oceans)</text>
<rect x="0" y="110" width="660" height="90" fill="#dfe9f5"/>
<text x="110" y="132" font-size="13" fill="#2f6db5">Atmosphere: water vapor, CO₂ … absorb infrared</text>
<line x1="90.0" y1="20.0" x2="90.0" y2="233.2" stroke="#e3a21a" stroke-width="4"/>
<path d="M90 246 L99.4 230.0 L80.6 230.0 Z" fill="#e3a21a"/>
<text x="102" y="40" fill="#9a6a00" font-size="13">Sunlight passes</text>
<text x="102" y="56" fill="#9a6a00" font-size="13">through the air</text>
<line x1="300.0" y1="246.0" x2="300.0" y2="172.8" stroke="#c8471d" stroke-width="4"/>
<path d="M300 160 L290.6 176.0 L309.4 176.0 Z" fill="#c8471d"/>
<text x="312" y="218" fill="#c8471d" font-size="13">Infrared from the ground</text>
<text x="312" y="234" fill="#c8471d" font-size="13">is absorbed by the air</text>
<line x1="470.0" y1="160.0" x2="470.0" y2="29.8" stroke="#c8471d" stroke-width="2.5"/>
<path d="M470 20 L463.0 32.3 L477.0 32.3 Z" fill="#c8471d"/>
<text x="482" y="40" fill="#c8471d" font-size="13">Part escapes to space</text>
<text x="482" y="56" fill="#c8471d" font-size="13">from high, cold layers</text>
<line x1="560.0" y1="160.0" x2="560.0" y2="236.2" stroke="#c8471d" stroke-width="2.5"/>
<path d="M560 246 L567.0 233.8 L553.0 233.8 Z" fill="#c8471d"/>
<text x="574" y="214" fill="#c8471d" font-size="13" text-anchor="start">Part is sent</text>
<text x="574" y="230" fill="#c8471d" font-size="13">back down</text>
<text x="640" y="300" text-anchor="end" font-size="13" font-weight="bold" fill="#fff">More absorbing gas → larger τ → more infrared sent back down → warmer ground</text>

</svg>
