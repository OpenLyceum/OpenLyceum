<line x1="40.0" y1="216.0" x2="293.5" y2="216.0" stroke="#e3a21a" stroke-width="2.2"/>
<path d="M302.6761924206188 216 L291.2 209.5 L291.2 222.5 Z" fill="#e3a21a"/>
<text x="40" y="50" fill="#e3a21a" font-weight="bold">Starlight</text>
<text x="40" y="68" fill="#e3a21a" font-size="12">S watts per square meter</text>
<circle cx="330" cy="150" r="70" fill="#cfe3f7" stroke="#2f6db5" stroke-width="2"/>
