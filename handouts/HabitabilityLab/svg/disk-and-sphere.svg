<text x="500" y="40" fill="#c8471d" font-weight="bold">Infrared out</text>
<text x="500" y="58" fill="#c8471d" font-size="12">from the whole sphere:</text>
<text x="500" y="74" fill="#c8471d" font-size="12">area 4πR²</text>
<text x="110" y="316" text-anchor="middle" font-size="13">In: S (1 − A) × πR²</text>
<text x="330" y="316" text-anchor="middle" font-size="13">Out: σT⁴ × 4πR²</text>
<text x="540" y="316" text-anchor="middle" font-size="13" font-weight="bold">Balance: σT⁴ = S (1 − A) ÷ 4</text>

</svg>
