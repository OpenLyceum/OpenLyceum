<svg xmlns="http://www.w3.org/2000/svg" width="660" height="330" viewBox="0 0 660 330" role="img" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">
<title>Why the absorbed starlight is divided by four</title>
<desc>Starlight falls on the disk the planet presents to its star, area pi R squared, but the planet radiates infrared from its whole sphere, area four pi R squared. At balance the emitted power per square meter is one quarter of the absorbed starlight.</desc>
