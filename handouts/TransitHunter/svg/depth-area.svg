<svg xmlns="http://www.w3.org/2000/svg" width="660" height="290" viewBox="0 0 660 290" role="img" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">
<title>Transit depth is an area ratio</title>
<desc>The Sun drawn with Jupiter and Earth to scale in front of it. The fraction of light blocked is the planet's disk area divided by the star's: about 1 percent for Jupiter and 0.008 percent for Earth.</desc>
<defs><radialGradient id="star" cx="0.45" cy="0.4" r="0.65"><stop offset="0" stop-color="#fff6d8"/><stop offset="0.7" stop-color="#f8d77a"/><stop offset="1" stop-color="#e2a92f"/></radialGradient></defs>
<rect width="660" height="290" fill="#ffffff"/>
<text x="160" y="24" text-anchor="middle" font-weight="bold">The Sun, Jupiter and Earth to scale</text>
<circle cx="160" cy="150" r="110" fill="url(#star)" stroke="#9a6a00" stroke-width="1.2"/>
<circle cx="130" cy="170" r="11.308" fill="#8a5a2b"/>
<text x="130" y="197.308" text-anchor="middle" font-size="12">Jupiter</text>
<circle cx="210" cy="120" r="1.2" fill="#2f6db5"/>
<line x1="212" y1="118" x2="240" y2="90" stroke="#2f6db5"/>
<text x="242" y="88" font-size="12" fill="#2f6db5">Earth (the dot)</text>
<text x="320" y="70" font-weight="bold">Light blocked = planet's disk ÷ star's disk</text>
<text x="320" y="100" font-size="14">depth = πRₚ² ÷ πR★² = (Rₚ ÷ R★)²</text>
<text x="320" y="140" font-size="14">Jupiter-sized:  (1 ÷ 9.7)²  ≈ 1 %  (1 part in 95)</text>
<text x="320" y="166" font-size="14">Earth-sized:    (1 ÷ 109)²  ≈ 0.008 %  (1 part in 12 000)</text>
<text x="320" y="206" font-size="14" font-weight="bold">Turned around: Rₚ = R★ × √depth</text>
<text x="320" y="232" font-size="13" fill="#57606a">We get the star's radius from its spectrum.</text>

</svg>
